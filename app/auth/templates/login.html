{% extends "base.html" %}
{% import "bootstrap_wtf.html" as wtf %}

{% block content %}
<div class="mt-4">
    <h2>User Login</h2>
    <div style="max-width: 400px;">
        {{ wtf.quick_form(form) }}
        <a href="{{ url_for('auth.sso_login') }}">Login with SSO</a>
        <p class="mt-3">New User? <a href="{{ url_for('auth.register') }}">Click to Register!</a></p>
    </div>
</div>
{% endblock %}
