{% extends "base.html" %}
{% import "bootstrap_wtf.html" as wtf %}

{% block content %}
<div class="mt-4">
    <h2>Create an Admin Account</h2>
    <div style="max-width: 500px;">
        <p>Register to Become a Laundry Admin!</p>
        {{ wtf.quick_form(form) }}
        <p class="mt-3">Already have an admin account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
    </div>
</div>
{% endblock %}
