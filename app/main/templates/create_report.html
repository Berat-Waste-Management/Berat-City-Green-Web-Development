{% extends "base.html" %}
{% import "bootstrap_wtf.html" as wtf %}

{% block content %}
<div class="container mt-4">
    <h1>Create New Report</h1>
    
    <form method="post" class="mt-4">
        {{ form.hidden_tag() }}

        <div class="mb-3">
            {{ wtf.form_field(form.reason) }}
        </div>
        <div class="mb-5">
            <input type="submit" value="Post" class="btn btn-primary px-5 py-2" style="width: 200px; border-radius: 8px;">
        </div>
    </form>
</div>
{% endblock %}
