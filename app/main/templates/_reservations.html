<div class="card mb-3 shadow-sm" id="reservation-{{ r.id }}">
  <div class="card-body">

    <h5 class="card-title mb-3">
      Reservation #{{ r.id }}
    </h5>

    <p class="mb-1">
      <span class="fw-semibold text-primary">Location:</span>
      {{ r.machine.location.name }}
    </p>

    <p class="mb-1">
      <span class="fw-semibold text-primary">Machine:</span>
      {{ r.machine.type }} #{{ r.machine.id }}
    </p>

    <p class="mb-1">
      <span class="fw-semibold text-primary">Start:</span>
      {{moment(r.start_time).format('LLLL') }}
    </p>

    <p class="mb-0">
      <span class="fw-semibold text-primary">End:</span>
     {{moment(r.end_time).format('LLLL') }}
    </p>

  </div>
</div>
