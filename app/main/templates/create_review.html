{% extends "base.html" %}
{% import "bootstrap_wtf.html" as wtf %}

{% block content %}
<div class="container mt-4">
    <h1>Write a Review</h1>

    <h4>Location:
        {{location.name}}
        </h4>
    <form method="post" class="mt-4">
        {{ form.hidden_tag() }}

        <div class="mb-3">
            {{ wtf.form_field(form.rating) }}
        </div>
        
        <div class="mb-3">
            {{ wtf.form_field(form.comment) }}
        </div>
        <div class="mb-5">
            <input type="submit" value="Post" class="btn btn-primary px-5 py-2" style="width: 200px; border-radius: 8px;">
        </div>
    </form>
</div>
{% endblock %}
